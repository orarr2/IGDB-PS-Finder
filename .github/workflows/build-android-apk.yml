name: Build Android APK

# Wraps the live PWA into an Android app (Trusted Web Activity) using Bubblewrap
# and uploads the installable APK as a downloadable artifact.
#
# Runs automatically when the Android config changes, or manually:
# Actions tab → "Build Android APK" → Run workflow. When it finishes, open the
# run → Artifacts → download "ps-recommender-apk", unzip, and sideload the .apk
# (you'll allow "install from unknown sources"). The app renders the real
# website in Chrome, so screenshots/cover art are full quality.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/github-project-ios-app-jfyprv
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      - name: Configure Bubblewrap (point at the runner's JDK & Android SDK)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{ "jdkPath": "%s", "androidSdkPath": "%s" }\n' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > "$HOME/.bubblewrap/config.json"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          cat "$HOME/.bubblewrap/config.json"
          ls "$ANDROID_SDK_ROOT"

      - name: Generate a signing key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore android.keystore \
            -alias psrecommender \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass psrecommender -keypass psrecommender \
            -dname "CN=PS Recommender, OU=App, O=orarr2, L=NA, S=NA, C=NA"

      - name: Build the APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: psrecommender
          BUBBLEWRAP_KEY_PASSWORD: psrecommender
        run: |
          bubblewrap doctor || true
          # `bubblewrap build` asks "regenerate your project? (Y/n)" when there's
          # no generated project yet; auto-answer yes since CI has no stdin.
          yes | bubblewrap build --skipPwaValidation
          echo "--- build output ---"
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps-recommender-apk
          path: |
            android/*.apk
            android/app-release-bundle.aab
          if-no-files-found: warn
