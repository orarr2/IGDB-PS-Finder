name: Compute CLIP embeddings

# Embeds every game's gameplay screenshots with CLIP (jina-clip-v1), commits
# the per-screenshot vectors (src/ml/clip_embeddings/), and upserts them into
# the game_clip_embeddings table that Hidden gems reads (needs the
# SUPABASE_SERVICE_KEY repository secret; the load step is skipped without it).
#
# Resumable + self-chaining: the script only embeds games not yet in the
# table, stops cleanly before the job timeout, and the last step re-dispatches
# this workflow while uncovered games remain - so one dispatch (or one push)
# eventually covers the whole catalog.
# Run: Actions → "Compute CLIP embeddings" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap number of games (0 = all)"
        default: "0"
  push:
    branches: [main]
    paths:
      - "src/ml/clip_embeddings.py"
      - ".github/workflows/build-clip-embeddings.yml"

permissions:
  contents: write
  actions: write  # the chain step re-dispatches this workflow

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pillow numpy requests einops timm
          pip install "transformers==4.40.2"   # jina-clip-v1 needs clip_loss (removed in newer)
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compute CLIP embeddings
        env:
          SHOTS: "3"
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          TIME_BUDGET_MIN: "150"
        run: |
          set -o pipefail
          export SUPABASE_URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' src/docs/config.js)
          export SUPABASE_KEY=$(grep -oP 'SUPABASE_KEY:\s*"\K[^"]+' src/docs/config.js)
          python src/ml/clip_embeddings.py 2>&1 | tee embed.log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ml/clip_embeddings
          git commit -m "Add CLIP screenshot embeddings [skip ci]" || { echo "no changes"; exit 0; }
          git push

      - name: Load into game_clip_embeddings (Hidden gems data)
        if: env.SUPABASE_SERVICE_KEY != ''
        run: |
          pip install --quiet "supabase>=2,<3"
          export SUPABASE_URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' src/docs/config.js)
          python src/ml/load_clip_embeddings.py

      - name: Load skipped
        if: env.SUPABASE_SERVICE_KEY == ''
        run: echo "::warning::SUPABASE_SERVICE_KEY secret not set - vectors were committed but NOT loaded into the game_clip_embeddings table."

      - name: Chain the next run while games remain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$(grep -o 'SUMMARY processed=[0-9]* remaining=[0-9]*' embed.log | tail -1)
          processed=$(echo "$summary" | grep -o 'processed=[0-9]*' | cut -d= -f2)
          remaining=$(echo "$summary" | grep -o 'remaining=[0-9]*' | cut -d= -f2)
          echo "This run: processed=${processed:-?} remaining=${remaining:-?}"
          if [ "${processed:-0}" -gt 0 ] && [ "${remaining:-0}" -gt 0 ]; then
            echo "Re-dispatching for the remaining $remaining games."
            curl -sS -o /dev/null -w "dispatch HTTP:%{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-clip-embeddings.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "Nothing left to chain - catalog covered (or nothing processable this run)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: clip-embeddings
          path: src/ml/clip_embeddings/*.json
          if-no-files-found: warn
