name: Compute visual similarity

# Runs the computer-vision pipeline (download IGDB gameplay screenshots → CNN
# embeddings → nearest visual neighbours) and commits the result
# (src/ml/visual_neighbors.json) back to the branch. That JSON is then loaded into
# the Supabase `visual_neighbors` table, which the app reads via
# get_visual_recommendations().
#
# Run manually: Actions → "Compute visual similarity" → Run workflow
# (optionally set `limit` to a small number for a quick test).

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap number of games (0 = all)"
        default: "0"
  push:
    branches:
      - main
    paths:
      - "src/ml/visual_similarity.py"
      - "src/ml/requirements.txt"
      - ".github/workflows/build-visual-similarity.yml"

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r src/ml/requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxscript

      - name: Compute embeddings, neighbours and export ONNX
        env:
          SHOTS: "3"
          TOPK: "12"
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: |
          # anon key is public (ships in src/docs/config.js); read it from there
          export SUPABASE_URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' src/docs/config.js)
          export SUPABASE_KEY=$(grep -oP 'SUPABASE_KEY:\s*"\K[^"]+' src/docs/config.js)
          python src/ml/visual_similarity.py

      - name: Load neighbours into Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pip install --quiet "supabase>=2,<3"
          export SUPABASE_URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' src/docs/config.js)
          python src/ml/load_visual_neighbors.py

      - name: Commit results back to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ml/visual_neighbors.json src/ml/embeddings src/docs/models
          git commit -m "Add visual embeddings, neighbours and ONNX model [skip ci]" || { echo "no changes"; exit 0; }
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: visual-data
          path: |
            src/ml/visual_neighbors.json
            src/ml/embeddings/*.json
          if-no-files-found: warn
