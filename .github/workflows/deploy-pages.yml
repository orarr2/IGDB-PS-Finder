name: Deploy app to GitHub Pages

# Publishes the PWA in src/docs/ to GitHub Pages.
#
# Using the GitHub Actions deployment method (instead of "Deploy from a branch")
# means Pages is enabled automatically on the first run -- no need to touch
# Settings -> Pages by hand. `enablement: true` on configure-pages creates the
# Pages site if it does not exist yet, which fixes the "There isn't a GitHub
# Pages site here" 404.

on:
  push:
    branches:
      - main
    paths:
      - "src/docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Required for the Pages deployment + OIDC token used by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site automatically if it isn't enabled yet.
          enablement: true

      - name: Upload app (src/docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
