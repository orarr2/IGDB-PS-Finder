name: Deploy app to GitHub Pages

# Publishes the PWA in src/docs/ to GitHub Pages.
#
# MANUAL-ONLY FALLBACK. The live site is served the other way: Settings ->
# Pages is set to "Deploy from a branch" (main, folder /), the root index.html
# redirects the canonical URL into src/docs/, and the root .nojekyll makes
# Pages serve files as-is. Dispatching THIS workflow instead serves src/docs/
# as the site ROOT, which changes every URL - installed home-screen apps
# pointing at /IGDB-PS-Finder/src/docs/ would break. Keep it manual so a
# routine push to src/docs/ can never flip the live URL layout by accident.

on:
  workflow_dispatch:

# Required for the Pages deployment + OIDC token used by deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site automatically if it isn't enabled yet.
          enablement: true

      - name: Upload app (src/docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
