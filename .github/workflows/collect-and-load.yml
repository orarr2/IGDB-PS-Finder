name: Collect IGDB & load into Supabase

# Manual only. Broadens/refreshes the games dataset (all PlayStation platforms
# by default) and upserts it into Supabase so series back-catalogs appear.
#
# Required repository secrets:
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET   (IGDB / Twitch app credentials)
#   SUPABASE_URL                             e.g. https://xxxx.supabase.co
#   SUPABASE_SERVICE_KEY                     service_role key (write access)

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "IGDB platform ids (comma-separated). Default = all PlayStation."
        required: false
        default: "7,8,9,38,46,48,167"

jobs:
  collect-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas requests tqdm pyarrow "supabase>=2,<3"

      - name: Collect from IGDB
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          IGDB_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: python src/desktop_app/collect_igdb.py

      - name: Load into Supabase (upsert by id)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PARQUET_PATH: igdb_dataset/data/games.parquet
        run: python src/desktop_app/load_to_supabase.py

      - name: Summary
        run: echo "Done. Dataset collected and upserted into Supabase. Existing rows are updated, new ones added (nothing deleted)."
